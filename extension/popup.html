<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Rigormining Capture</title>
    <style>
      body {
        width: 260px;
        font-family: system-ui, sans-serif;
        padding: 12px;
      }
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 8px;
      }
      .header strong {
        font-size: 13px;
        color: #111;
      }
      #open-settings {
        all: unset;
        cursor: pointer;
        font-size: 16px;
        line-height: 1;
        padding: 2px 4px;
        border-radius: 4px;
      }
      #open-settings:hover {
        background: #f1f1f1;
      }
      button#capture {
        width: 100%;
        padding: 8px;
        font-size: 14px;
        cursor: pointer;
      }
      #status {
        margin-top: 10px;
        font-size: 13px;
        color: #444;
      }
      a {
        color: #4f46e5;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <strong>Rigormining</strong>
      <button id="open-settings" title="Extension settings">&#9881;&#65039;</button>
    </div>
    <button id="capture">Add this page to Rigormining</button>
    <div id="status"></div>
    <script src="popup.js"></script>
  </body>
</html>
